<script>
/* Раскладка пролёта включается сразу, до первой отрисовки: иначе страница
   рисуется стопкой в девять экранов и потом схлопывается.
   Если скрипт так и не доехал, через восемь секунд откатываемся к обычной
   прокручиваемой стопке — чёрный экран не остаётся ни при каких условиях. */
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  setTimeout(function () {
    if (!d.classList.contains('ready')) d.classList.remove('js');
  }, 8000);
})();
</script>
