<link rel="manifest" href="/site.webmanifest">
<script>
/* Режим и флаги — до первой отрисовки, чтобы страница не мигала.
   URL важнее localStorage; без скрипта остаётся .no-js и режим all. */
(function () {
  var d = document.documentElement, m = null, ok = /^(all|chamber|big)$/;
  d.className = d.className.replace('no-js', 'js');
  try { var q = new URLSearchParams(location.search).get('mode'); if (ok.test(q)) m = q; } catch (e) {}
  if (!m) { try { m = localStorage.getItem('ne-mode'); } catch (e) {} if (!ok.test(m)) m = 'all'; }
  d.setAttribute('data-mode', m);
  try { if (sessionStorage.getItem('ne-seen')) d.className += ' seen'; } catch (e) {}
  try { if (localStorage.getItem('ne-touched')) d.className += ' touched'; } catch (e) {}
})();
</script>
